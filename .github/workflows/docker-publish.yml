name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The actions are named by their commit, a changed tag can not change what runs here
# with the right to write the image.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Capture build metadata
        id: meta
        run: |
          echo "git_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(git show -s --format=%cI HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./packages/app/Dockerfile.rootless
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PAPRA_VERSION=latest
            GIT_COMMIT=${{ steps.meta.outputs.git_commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          # Only latest: with a second tag GitHub shows that one in "Install from the command line"
          tags: ghcr.io/gatzenga/papra:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
